<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff6df">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="1週間の朝ごはんと、朝のやることを自分で確認できる家族向けPWA">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>あさのじゅんび</title>
  <style>
    :root {
      --app-vh: 100dvh;
      --landscape-scale: 1;
      --bg: #fff8ea;
      --panel: #ffffff;
      --ink: #332b25;
      --muted: #786e64;
      --line: #eadcc7;
      --accent: #f0a53a;
      --accent-soft: #fff0cb;
      --done: #e1f4df;
      --done-line: #86bd83;
      --shadow: 0 8px 24px rgba(84, 62, 30, .08);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: var(--app-vh);
      font-family: system-ui, -apple-system, "Noto Sans JP", "Hiragino Sans", sans-serif;
      color: var(--ink);
      background: var(--bg);
      -webkit-tap-highlight-color: transparent;
    }

    button { font: inherit; }

    .app {
      width: min(1120px, 100%);
      min-height: var(--app-vh);
      margin: 0 auto;
      padding:
        calc(18px + env(safe-area-inset-top))
        calc(14px + env(safe-area-inset-right))
        calc(40px + env(safe-area-inset-bottom))
        calc(14px + env(safe-area-inset-left));
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 6vw, 48px);
      letter-spacing: .04em;
    }

    .today {
      color: var(--muted);
      font-weight: 800;
      text-align: right;
      white-space: nowrap;
    }

    h2 {
      margin: 22px 0 8px;
      font-size: clamp(22px, 4.5vw, 30px);
    }

    .hint {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
    }

    .week {
      display: grid;
      grid-template-columns: repeat(7, minmax(124px, 1fr));
      gap: 10px;
      overflow-x: auto;
      padding: 2px 2px 10px;
      scroll-snap-type: x proximity;
    }

    .day {
      min-width: 124px;
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: 18px;
      padding: 10px;
      box-shadow: var(--shadow);
      scroll-snap-align: start;
    }

    .day.current {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .day-name {
      text-align: center;
      font-size: 26px;
      font-weight: 950;
    }

    .today-badge {
      display: block;
      height: 20px;
      margin: 0 0 6px;
      color: #9a6111;
      text-align: center;
      font-size: 12px;
      font-weight: 950;
    }

    .food {
      width: 100%;
      min-height: 72px;
      margin-top: 7px;
      border: 2px solid var(--line);
      border-radius: 15px;
      background: #fff;
      color: var(--ink);
      font-weight: 950;
      cursor: pointer;
      touch-action: manipulation;
    }

    .food:active { transform: scale(.98); }

    .food:focus-visible,
    .todo:focus-visible,
    .reset:focus-visible {
      outline: 4px solid rgba(240, 165, 58, .35);
      outline-offset: 2px;
    }

    .emoji {
      display: block;
      font-size: 31px;
      line-height: 1.15;
      margin-bottom: 2px;
    }

    .weather-card {
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 12px;
      margin: 10px 0 14px;
      padding: 12px 14px;
      border: 2px solid var(--line);
      border-radius: 18px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .weather-date {
      color: var(--ink);
      font-size: 18px;
      font-weight: 950;
      white-space: nowrap;
    }

    .weather-icon {
      font-size: 42px;
      line-height: 1;
    }

    .weather-main {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      overflow: hidden;
    }

    .weather-title {
      font-size: 18px;
      font-weight: 950;
    }

    .weather-detail {
      margin-top: 0;
      color: var(--muted);
      font-size: 16px;
      font-weight: 850;
      white-space: nowrap;
    }

    .weather-advice {
      text-align: right;
      font-size: 16px;
      font-weight: 950;
      white-space: nowrap;
    }

    .weather-refresh {
      grid-column: auto;
      justify-self: end;
      min-height: 36px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--muted);
      padding: 5px 10px;
      font-weight: 850;
      cursor: pointer;
    }

    .weather-card.loading {
      opacity: .75;
    }

    .bottom {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(260px, .75fr);
      gap: 14px;
    }

    .card {
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: 20px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .todos {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .todo {
      min-height: 84px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 2px solid var(--line);
      border-radius: 16px;
      background: #fff;
      padding: 12px 14px;
      color: var(--ink);
      text-align: left;
      font-size: 20px;
      font-weight: 950;
      cursor: pointer;
      touch-action: manipulation;
    }

    .todo.done {
      background: var(--done);
      border-color: var(--done-line);
    }

    .check {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      display: grid;
      place-items: center;
      border: 3px solid #b9aa99;
      border-radius: 11px;
      background: #fff;
      font-size: 26px;
      line-height: 1;
    }

    .todo.done .check { border-color: var(--done-line); }
    .todo.done .label { text-decoration: line-through; color: #55705a; }

    .progress {
      margin-top: 12px;
      color: var(--muted);
      font-weight: 900;
    }

    .progress.complete {
      color: #277638;
      font-size: 19px;
    }

    .times {
      display: grid;
      gap: 6px;
      align-content: start;
    }

    .time-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 9px 2px 13px;
      border-bottom: 1px solid var(--line);
    }

    .time-row:last-child { border-bottom: 0; }

    .time-label {
      font-size: 18px;
      font-weight: 900;
    }

    .time {
      font-size: 29px;
      font-weight: 950;
      letter-spacing: .02em;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .reset {
      min-height: 44px;
      border: 2px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--muted);
      padding: 8px 14px;
      font-weight: 850;
      cursor: pointer;
    }

    .page { display: none; }
    .page.active { display: block; }

    .tabs {
      display: flex;
      gap: 8px;
      margin: 0 0 12px;
    }

    .tab {
      min-height: 44px;
      flex: 1;
      border: 2px solid var(--line);
      border-radius: 14px;
      background: #fff;
      color: var(--muted);
      font-weight: 900;
      cursor: pointer;
    }

    .tab.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--ink);
    }

    .calendar-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 8px 0 10px;
    }

    .calendar-toolbar button {
      min-height: 42px;
      border: 2px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      padding: 7px 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .calendar-toolbar button.primary {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .calendar-toolbar button:disabled {
      opacity: .5;
      cursor: default;
    }

    .calendar-range {
      margin-left: auto;
      color: var(--muted);
      font-weight: 900;
      white-space: nowrap;
    }

    .calendar-status {
      min-height: 22px;
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .calendar-status.error {
      color: #a33d2c;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      align-items: start;
    }

    .calendar-day {
      min-width: 0;
      min-height: 260px;
      border: 2px solid var(--line);
      border-radius: 14px;
      background: #fff;
      overflow: hidden;
    }

    .calendar-day.is-today {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .calendar-day-head {
      padding: 12px 8px 10px;
      border-bottom: 1px solid var(--line);
      text-align: center;
      font-weight: 950;
      line-height: 1.2;
    }

    .calendar-day-head .date {
      display: block;
      font-size: 30px;
    }

    .calendar-day-head .dow {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 17px;
    }

    .calendar-events {
      display: grid;
      gap: 9px;
      padding: 10px;
    }

    .calendar-event {
      min-width: 0;
      padding: 10px 12px;
      border-left: 6px solid var(--accent);
      border-radius: 10px;
      background: #f8f6f2;
      overflow-wrap: anywhere;
    }

    .calendar-event.all-day {
      border-left-color: #7a96c8;
      background: #eef3fb;
    }

    .event-time {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 16px;
      font-weight: 850;
    }

    .event-title {
      display: block;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.25;
    }

    .calendar-empty {
      padding: 20px 6px;
      color: #a89d91;
      text-align: center;
      font-size: 18px;
      font-weight: 800;
    }

    .calendar-note {
      margin: 4px 0 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    @media (max-width: 720px) {
      .app {
        padding-top: calc(14px + env(safe-area-inset-top));
      }
      header { align-items: start; }
      .today { font-size: 13px; }
      .week { grid-template-columns: repeat(7, 136px); }
      .day { min-width: 136px; }
      .bottom { grid-template-columns: 1fr; }
      .todos { grid-template-columns: 1fr; }

      .calendar-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        overflow-x: auto;
        padding-bottom: 8px;
      }

      .calendar-day {
        min-width: 0;
      }

      .calendar-toolbar {
        gap: 6px;
      }

      .calendar-toolbar button {
        min-height: 40px;
        padding: 6px 9px;
        font-size: 13px;
      }

      .calendar-range {
        width: 100%;
        margin-left: 0;
        text-align: center;
        font-size: 13px;
      }
    }


    @media (orientation: landscape) and (max-height: 520px) {
      body {
        overflow-x: hidden;
        overflow-y: auto;
      }

      .app {
        width: 100%;
        max-width: none;
        min-height: var(--app-vh);
        padding:
          3px
          calc(8px + env(safe-area-inset-right))
          3px
          calc(8px + env(safe-area-inset-left));
      }

      .app.fit-landscape {
        transform: scale(var(--landscape-scale));
        transform-origin: top left;
        width: calc(100% / var(--landscape-scale));
      }

      header {
        margin-bottom: 4px;
        align-items: center;
      }

      h1 {
        font-size: 24px;
      }

      .today {
        font-size: 12px;
      }

      h2 {
        margin: 6px 0 4px;
        font-size: 17px;
      }

      .hint {
        display: none;
      }

      .week {
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 6px;
        overflow: visible;
        padding: 0;
      }

      .day {
        min-width: 0;
        border-radius: 12px;
        padding: 5px;
        box-shadow: none;
      }

      .day-name {
        font-size: 18px;
        line-height: 1;
      }

      .today-badge {
        height: 13px;
        margin: 1px 0 2px;
        font-size: 9px;
        line-height: 1.1;
      }

      .food {
        min-height: 44px;
        margin-top: 4px;
        border-radius: 10px;
        font-size: 12px;
        padding: 2px;
      }

      .food .emoji {
        display: inline;
        font-size: 18px;
        margin: 0 3px 0 0;
      }

      .weather-card {
        grid-template-columns: auto auto minmax(0, 1fr) auto;
        gap: 8px;
        margin: 4px 0 5px;
        padding: 6px 8px;
        border-radius: 10px;
        box-shadow: none;
      }

      .weather-date { font-size: 14px; }
      .weather-icon { font-size: 28px; }
      .weather-main { gap: 8px; }
      .weather-title { font-size: 15px; }
      .weather-detail { margin-top: 0; font-size: 14px; }
      .weather-advice { font-size: 14px; }
      .weather-refresh {
        display: none;
      }

      .bottom {
        grid-template-columns: minmax(0, 1.8fr) minmax(180px, .8fr);
        gap: 8px;
      }

      .card {
        padding: 7px;
        border-radius: 12px;
        box-shadow: none;
      }

      .todos {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
      }

      .todo {
        min-height: 48px;
        gap: 5px;
        border-radius: 10px;
        padding: 4px 6px;
        font-size: 12px;
      }

      .todo .emoji {
        font-size: 18px;
        margin: 0;
      }

      .check {
        width: 24px;
        height: 24px;
        flex-basis: 24px;
        border-width: 2px;
        border-radius: 7px;
        font-size: 16px;
      }

      .progress {
        margin-top: 4px;
        font-size: 11px;
      }

      .progress.complete {
        font-size: 12px;
      }

      .times {
        gap: 0;
      }

      .time-row {
        padding: 3px 0 5px;
      }

      .time-label {
        font-size: 12px;
      }

      .time {
        font-size: 18px;
      }

      .actions {
        margin-top: 4px;
      }

      .reset {
        min-height: 30px;
        padding: 2px 8px;
        font-size: 11px;
        border-radius: 8px;
      }

      .tabs {
        margin-bottom: 5px;
        gap: 6px;
      }

      .tab {
        min-height: 34px;
        border-radius: 9px;
        font-size: 12px;
      }

      #calendarPage header {
        margin-bottom: 3px;
      }

      .calendar-note {
        display: none;
      }

      .calendar-toolbar {
        margin: 3px 0 5px;
        gap: 4px;
      }

      .calendar-toolbar button {
        min-height: 30px;
        padding: 2px 7px;
        border-radius: 8px;
        font-size: 11px;
      }

      .calendar-range {
        margin-left: auto;
        width: auto;
        font-size: 11px;
      }

      .calendar-status {
        min-height: 16px;
        margin-bottom: 3px;
        font-size: 10px;
      }

      .calendar-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px;
        overflow: visible;
        padding: 0;
      }

      .calendar-day {
        min-width: 0;
        min-height: 230px;
        border-radius: 8px;
      }

      .calendar-day-head {
        padding: 7px 4px 6px;
      }

      .calendar-day-head .date {
        font-size: 22px;
      }

      .calendar-day-head .dow {
        font-size: 13px;
      }

      .calendar-events {
        gap: 6px;
        padding: 6px;
      }

      .calendar-event {
        padding: 7px 8px;
        border-left-width: 5px;
        border-radius: 8px;
      }

      .event-time {
        margin-bottom: 2px;
        font-size: 13px;
      }

      .event-title {
        font-size: 18px;
        line-height: 1.2;
      }

      .calendar-empty {
        padding: 14px 4px;
        font-size: 15px;
      }
    }

    @media (orientation: landscape) and (max-height: 430px) {
      h1 { font-size: 20px; }
      h2 { margin: 4px 0 3px; font-size: 15px; }

      .tabs { margin-bottom: 3px; }
      .tab { min-height: 30px; }

      .day { padding: 4px; }
      .day-name { font-size: 16px; }
      .food {
        min-height: 38px;
        margin-top: 3px;
      }

      .bottom { gap: 6px; }
      .card { padding: 5px; }
      .todo {
        min-height: 42px;
        padding: 3px 5px;
        font-size: 11px;
      }

      .time-row { padding: 2px 0 4px; }
      .time { font-size: 16px; }

      .calendar-toolbar { margin: 2px 0 3px; }
      .calendar-status { min-height: 14px; margin-bottom: 2px; }
      .calendar-day { min-height: 190px; }
      .calendar-day-head { padding: 5px 4px 4px; }
      .calendar-events { gap: 4px; padding: 4px; }
      .calendar-event { padding: 5px 6px; }
      .event-title { font-size: 16px; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .food, .todo { transition: transform .08s ease, background-color .15s ease, border-color .15s ease; }
    }
  </style>
</head>
<body>
  <main class="app">
    <nav class="tabs" aria-label="ページ切り替え">
      <button id="morningTab" class="tab active" type="button" aria-selected="true">🌅 あさ</button>
      <button id="calendarTab" class="tab" type="button" aria-selected="false">📅 カレンダー</button>
    </nav>

    <div id="morningPage" class="page active">
      <header>
        <h1>あさのじゅんび</h1>
      </header>

      <section id="weatherCard" class="weather-card" aria-label="きょうの日付と天気">
        <div id="todayText" class="weather-date" aria-live="polite"></div>
        <div id="weatherIcon" class="weather-icon" aria-hidden="true">🌤️</div>
        <div class="weather-main">
          <div id="weatherTitle" class="weather-title">きょうの天気</div>
          <div id="weatherDetail" class="weather-detail">現在地の天気を取得します</div>
        </div>
        <div id="weatherAdvice" class="weather-advice">—</div>
        <button id="weatherRefresh" class="weather-refresh" type="button">更新</button>
      </section>

      <section aria-labelledby="mealHeading">
      <h2 id="mealHeading">こんしゅうの あさごはん</h2>
      <p class="hint">タップすると「ごはん ↔ パン」「たまご ↔ ヨーグルト」がかわるよ。</p>
      <div id="week" class="week"></div>
    </section>

    <section aria-labelledby="todoHeading">
      <h2 id="todoHeading">あさの やること</h2>
      <div class="bottom">
        <div class="card">
          <div id="todos" class="todos"></div>
          <div id="progress" class="progress" aria-live="polite"></div>
          <div class="actions">
            <button id="resetTodos" class="reset" type="button">チェックをもどす</button>
          </div>
        </div>

        <div class="card times" aria-label="あさのじかん">
          <div class="time-row">
            <div class="time-label">🌅 おきる</div>
            <div class="time">6:30</div>
          </div>
          <div class="time-row">
            <div class="time-label">🧢 おしたく</div>
            <div class="time">7:30</div>
          </div>
          <div class="time-row">
            <div class="time-label">🎒 しゅっぱつ</div>
            <div class="time">7:45</div>
          </div>
        </div>
      </div>
      </section>
    </div>

    <div id="calendarPage" class="page">
      <header>
        <h1>かぞくのカレンダー</h1>
        <div class="today">Google カレンダー</div>
      </header>
      <p class="calendar-note">Googleカレンダーから予定だけ取得して、このアプリ専用の2日表示にしています。</p>

      <div class="calendar-toolbar">
        <button id="prevWeek" type="button" aria-label="前の2日">← 前の2日</button>
        <button id="thisWeek" type="button">今日</button>
        <button id="nextWeek" type="button" aria-label="次の2日">次の2日 →</button>
        <button id="connectGoogle" class="primary" type="button">Googleに接続</button>
        <div id="calendarRange" class="calendar-range"></div>
      </div>

      <div id="calendarStatus" class="calendar-status" aria-live="polite">Googleに接続すると家族の予定を表示します。</div>
      <div id="calendarGrid" class="calendar-grid" aria-label="家族の2日分の予定"></div>
    </div>
  </main>

  <script>
    (() => {
      const DAY_NAMES = ["日", "月", "火", "水", "木", "金", "土"];
      const ORDER = [
        { jsDay: 1, label: "月" },
        { jsDay: 2, label: "火" },
        { jsDay: 3, label: "水" },
        { jsDay: 4, label: "木" },
        { jsDay: 5, label: "金" },
        { jsDay: 6, label: "土" },
        { jsDay: 0, label: "日" }
      ];

      const DEFAULT_MEALS = [
        { main: "ごはん", side: "たまご" },
        { main: "パン", side: "ヨーグルト" },
        { main: "ごはん", side: "たまご" },
        { main: "パン", side: "たまご" },
        { main: "ごはん", side: "ヨーグルト" },
        { main: "パン", side: "ヨーグルト" },
        { main: "ごはん", side: "ヨーグルト" }
      ];

      const FOOD = {
        "ごはん": { icon: "🍚", next: "パン" },
        "パン": { icon: "🍞", next: "ごはん" },
        "たまご": { icon: "🥚", next: "ヨーグルト" },
        "ヨーグルト": { icon: "🥣", next: "たまご" }
      };

      const TODO_ITEMS = [
        { id: "breakfast", icon: "🍚", label: "ごはん" },
        { id: "toilet", icon: "🚽", label: "トイレ" },
        { id: "change", icon: "👕", label: "おきがえ" },
        { id: "bag", icon: "🎒", label: "にもつチェック" }
      ];

      const now = new Date();
      const dateKey = [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, "0"),
        String(now.getDate()).padStart(2, "0")
      ].join("-");

      const MEAL_KEY = "asa-junbi-meals-v1";
      const TODO_KEY = "asa-junbi-todos-" + dateKey;

      function copy(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function load(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : copy(fallback);
        } catch {
          return copy(fallback);
        }
      }

      let meals = load(MEAL_KEY, DEFAULT_MEALS);
      let done = load(TODO_KEY, {});

      document.getElementById("todayText").textContent =
        (now.getMonth() + 1) + "月" + now.getDate() + "日（" + DAY_NAMES[now.getDay()] + "）";

      function saveMeals() {
        localStorage.setItem(MEAL_KEY, JSON.stringify(meals));
      }

      function saveTodos() {
        localStorage.setItem(TODO_KEY, JSON.stringify(done));
      }

      const weatherCard = document.getElementById("weatherCard");
      const weatherIcon = document.getElementById("weatherIcon");
      const weatherTitle = document.getElementById("weatherTitle");
      const weatherDetail = document.getElementById("weatherDetail");
      const weatherAdvice = document.getElementById("weatherAdvice");
      const weatherRefresh = document.getElementById("weatherRefresh");
      const WEATHER_LOCATION_KEY = "asa-junbi-weather-location-v1";

      function weatherPresentation(code) {
        if (code === 0) return { icon: "☀️", label: "晴れ" };
        if ([1, 2].includes(code)) return { icon: "🌤️", label: "晴れときどき曇り" };
        if (code === 3) return { icon: "☁️", label: "曇り" };
        if ([45, 48].includes(code)) return { icon: "🌫️", label: "霧" };
        if ([51, 53, 55, 56, 57].includes(code)) return { icon: "🌦️", label: "小雨" };
        if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return { icon: "🌧️", label: "雨" };
        if ([71, 73, 75, 77, 85, 86].includes(code)) return { icon: "🌨️", label: "雪" };
        if ([95, 96, 99].includes(code)) return { icon: "⛈️", label: "雷雨" };
        return { icon: "🌤️", label: "天気" };
      }

      function getSavedWeatherLocation() {
        try {
          const raw = localStorage.getItem(WEATHER_LOCATION_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch {
          return null;
        }
      }

      function saveWeatherLocation(latitude, longitude) {
        try {
          localStorage.setItem(
            WEATHER_LOCATION_KEY,
            JSON.stringify({ latitude, longitude })
          );
        } catch {}
      }

      function getCurrentPosition() {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) {
            reject(new Error("位置情報に対応していません"));
            return;
          }
          navigator.geolocation.getCurrentPosition(
            position => resolve({
              latitude: position.coords.latitude,
              longitude: position.coords.longitude
            }),
            reject,
            {
              enableHighAccuracy: false,
              timeout: 10000,
              maximumAge: 60 * 60 * 1000
            }
          );
        });
      }

      async function fetchWeather(location) {
        const params = new URLSearchParams({
          latitude: String(location.latitude),
          longitude: String(location.longitude),
          current: "temperature_2m,weather_code",
          daily: "temperature_2m_max,temperature_2m_min,precipitation_probability_max",
          timezone: "auto",
          forecast_days: "1"
        });

        const response = await fetch("https://api.open-meteo.com/v1/forecast?" + params.toString());
        if (!response.ok) throw new Error("天気API " + response.status);
        return response.json();
      }

      async function updateWeather(forceLocation = false) {
        weatherCard.classList.add("loading");
        weatherDetail.textContent = "天気を取得しています…";
        weatherAdvice.textContent = "—";

        try {
          let location = !forceLocation ? getSavedWeatherLocation() : null;
          if (!location) {
            location = await getCurrentPosition();
            saveWeatherLocation(location.latitude, location.longitude);
          }

          const data = await fetchWeather(location);
          const current = data.current || {};
          const daily = data.daily || {};
          const presentation = weatherPresentation(Number(current.weather_code));

          const temp = Math.round(Number(current.temperature_2m));
          const max = Math.round(Number((daily.temperature_2m_max || [])[0]));
          const min = Math.round(Number((daily.temperature_2m_min || [])[0]));
          const rain = Math.round(Number((daily.precipitation_probability_max || [])[0]));

          weatherIcon.textContent = presentation.icon;
          weatherTitle.textContent = presentation.label + "　" + temp + "℃";
          weatherDetail.textContent =
            "↑" + max + "℃ ↓" + min + "℃　☔" + rain + "%";

          if (rain >= 50) {
            weatherAdvice.textContent = "🌂 かさ";
          } else if (rain >= 30) {
            weatherAdvice.textContent = "☂️ かさ？";
          } else {
            weatherAdvice.textContent = "👌 かさ不要";
          }
        } catch (error) {
          console.error(error);
          weatherIcon.textContent = "📍";
          weatherTitle.textContent = "天気を表示できません";
          weatherDetail.textContent = "「天気を更新」で位置情報を許可してください";
          weatherAdvice.textContent = "";
        } finally {
          weatherCard.classList.remove("loading");
          requestAnimationFrame(updateMeasuredViewport);
        }
      }

      weatherRefresh.addEventListener("click", () => updateWeather(true));

      function foodButton(name, onClick) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "food";
        button.setAttribute("aria-label", name + "。タップで切り替え");
        button.innerHTML =
          '<span class="emoji" aria-hidden="true">' + FOOD[name].icon + "</span>" +
          "<span>" + name + "</span>";
        button.addEventListener("click", onClick);
        return button;
      }

      function renderMeals() {
        const week = document.getElementById("week");
        week.innerHTML = "";

        ORDER.forEach((dayDef, index) => {
          if (!meals[index] || !FOOD[meals[index].main] || !FOOD[meals[index].side]) {
            meals[index] = copy(DEFAULT_MEALS[index]);
          }

          const card = document.createElement("article");
          const isToday = now.getDay() === dayDef.jsDay;
          card.className = "day" + (isToday ? " current" : "");

          const dayName = document.createElement("div");
          dayName.className = "day-name";
          dayName.textContent = dayDef.label;

          const badge = document.createElement("span");
          badge.className = "today-badge";
          badge.textContent = isToday ? "きょう" : "";

          const main = foodButton(meals[index].main, () => {
            meals[index].main = FOOD[meals[index].main].next;
            saveMeals();
            renderMeals();
          });

          const side = foodButton(meals[index].side, () => {
            meals[index].side = FOOD[meals[index].side].next;
            saveMeals();
            renderMeals();
          });

          card.append(dayName, badge, main, side);
          week.appendChild(card);
        });
      }

      function renderTodos() {
        const list = document.getElementById("todos");
        list.innerHTML = "";

        TODO_ITEMS.forEach(item => {
          const isDone = Boolean(done[item.id]);
          const button = document.createElement("button");
          button.type = "button";
          button.className = "todo" + (isDone ? " done" : "");
          button.setAttribute("aria-pressed", isDone ? "true" : "false");
          button.innerHTML =
            '<span class="check" aria-hidden="true">' + (isDone ? "✓" : "") + "</span>" +
            '<span class="emoji" aria-hidden="true">' + item.icon + "</span>" +
            '<span class="label">' + item.label + "</span>";

          button.addEventListener("click", () => {
            done[item.id] = !done[item.id];
            saveTodos();
            renderTodos();
          });

          list.appendChild(button);
        });

        const count = TODO_ITEMS.filter(item => done[item.id]).length;
        const progress = document.getElementById("progress");
        if (count === TODO_ITEMS.length) {
          progress.textContent = "ぜんぶできた！ 🎉 いってらっしゃい！";
          progress.className = "progress complete";
        } else {
          progress.textContent = count + " / " + TODO_ITEMS.length + " できたよ";
          progress.className = "progress";
        }
      }

      document.getElementById("resetTodos").addEventListener("click", () => {
        done = {};
        saveTodos();
        renderTodos();
      });

      const morningTab = document.getElementById("morningTab");
      const calendarTab = document.getElementById("calendarTab");
      const morningPage = document.getElementById("morningPage");
      const calendarPage = document.getElementById("calendarPage");

      function showPage(page) {
        const calendar = page === "calendar";
        morningPage.classList.toggle("active", !calendar);
        calendarPage.classList.toggle("active", calendar);
        morningTab.classList.toggle("active", !calendar);
        calendarTab.classList.toggle("active", calendar);
        morningTab.setAttribute("aria-selected", String(!calendar));
        calendarTab.setAttribute("aria-selected", String(calendar));
      }

      morningTab.addEventListener("click", () => {
        showPage("morning");
        requestAnimationFrame(updateMeasuredViewport);
      });
      calendarTab.addEventListener("click", () => {
        showPage("calendar");
        requestAnimationFrame(updateMeasuredViewport);
      });

      const GOOGLE_CLIENT_ID = "761227648930-u3vn0c336opgpfi63actamnal10jjvaf.apps.googleusercontent.com";
      const FAMILY_CALENDAR_ID = "family16318131722654926522@group.calendar.google.com";
      const CALENDAR_SCOPE = "https://www.googleapis.com/auth/calendar.events.readonly";
      const calendarGrid = document.getElementById("calendarGrid");
      const calendarStatus = document.getElementById("calendarStatus");
      const calendarRange = document.getElementById("calendarRange");
      const connectGoogle = document.getElementById("connectGoogle");
      const prevWeek = document.getElementById("prevWeek");
      const thisWeek = document.getElementById("thisWeek");
      const nextWeek = document.getElementById("nextWeek");

      let tokenClient = null;
      let accessToken = "";
      let dayOffset = 0;
      let identityPromise = null;

      function pad2(n) {
        return String(n).padStart(2, "0");
      }

      function dateKeyLocal(d) {
        return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
      }

      function parseDateOnly(value) {
        const [y, m, d] = value.split("-").map(Number);
        return new Date(y, m - 1, d, 0, 0, 0, 0);
      }

      function displayedPeriodStart() {
        const d = new Date();
        d.setHours(0, 0, 0, 0);
        d.setDate(d.getDate() + dayOffset);
        return d;
      }

      function addDays(date, n) {
        const d = new Date(date);
        d.setDate(d.getDate() + n);
        return d;
      }

      function eventBounds(event) {
        const start = event.start && (event.start.dateTime
          ? new Date(event.start.dateTime)
          : parseDateOnly(event.start.date));
        const end = event.end && (event.end.dateTime
          ? new Date(event.end.dateTime)
          : parseDateOnly(event.end.date));
        return { start, end };
      }

      function touchesDay(event, dayStart) {
        const dayEnd = addDays(dayStart, 1);
        const bounds = eventBounds(event);
        return bounds.start < dayEnd && bounds.end > dayStart;
      }

      function formatTime(event, dayStart) {
        if (event.start && event.start.date) return "終日";
        const start = new Date(event.start.dateTime);
        const end = new Date(event.end.dateTime);
        const beginsBefore = start < dayStart;
        const dayEnd = addDays(dayStart, 1);
        const endsAfter = end > dayEnd;
        if (beginsBefore && endsAfter) return "終日";
        if (beginsBefore) return "〜" + pad2(end.getHours()) + ":" + pad2(end.getMinutes());
        if (endsAfter) return pad2(start.getHours()) + ":" + pad2(start.getMinutes()) + "〜";
        return pad2(start.getHours()) + ":" + pad2(start.getMinutes());
      }

      function renderCalendar(events = []) {
        const start = displayedPeriodStart();
        const end = addDays(start, 1);
        calendarRange.textContent =
          (start.getMonth() + 1) + "/" + start.getDate() + " 〜 " +
          (end.getMonth() + 1) + "/" + end.getDate();

        calendarGrid.innerHTML = "";
        const todayKey = dateKeyLocal(new Date());
        const dows = ["日", "月", "火", "水", "木", "金", "土"];

        for (let i = 0; i < 2; i++) {
          const day = addDays(start, i);
          const dayKey = dateKeyLocal(day);
          const dayEvents = events
            .filter(event => touchesDay(event, day))
            .sort((a, b) => eventBounds(a).start - eventBounds(b).start);

          const col = document.createElement("section");
          col.className = "calendar-day" + (dayKey === todayKey ? " is-today" : "");

          const head = document.createElement("div");
          head.className = "calendar-day-head";
          head.innerHTML =
            '<span class="date">' + (day.getMonth() + 1) + "/" + day.getDate() + "</span>" +
            '<span class="dow">' + dows[day.getDay()] + "</span>";
          col.appendChild(head);

          const list = document.createElement("div");
          list.className = "calendar-events";

          if (!dayEvents.length) {
            const empty = document.createElement("div");
            empty.className = "calendar-empty";
            empty.textContent = "予定なし";
            list.appendChild(empty);
          } else {
            dayEvents.forEach(event => {
              const item = document.createElement("div");
              const allDay = Boolean(event.start && event.start.date);
              item.className = "calendar-event" + (allDay ? " all-day" : "");

              const time = document.createElement("span");
              time.className = "event-time";
              time.textContent = formatTime(event, day);

              const title = document.createElement("span");
              title.className = "event-title";
              title.textContent = event.summary || "（タイトルなし）";

              item.append(time, title);
              list.appendChild(item);
            });
          }

          col.appendChild(list);
          calendarGrid.appendChild(col);
        }
      }

      function setCalendarStatus(message, isError = false) {
        calendarStatus.textContent = message;
        calendarStatus.className = "calendar-status" + (isError ? " error" : "");
      }

      function loadGoogleIdentity() {
        if (window.google && google.accounts && google.accounts.oauth2) {
          return Promise.resolve();
        }
        if (identityPromise) return identityPromise;

        identityPromise = new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = "https://accounts.google.com/gsi/client";
          script.async = true;
          script.defer = true;
          script.onload = resolve;
          script.onerror = () => reject(new Error("Googleログイン用ライブラリを読み込めませんでした。"));
          document.head.appendChild(script);
        });
        return identityPromise;
      }

      async function ensureTokenClient() {
        await loadGoogleIdentity();
        if (tokenClient) return tokenClient;

        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: GOOGLE_CLIENT_ID,
          scope: CALENDAR_SCOPE,
          callback: () => {}
        });
        return tokenClient;
      }

      function requestAccessToken() {
        return new Promise(async (resolve, reject) => {
          try {
            const client = await ensureTokenClient();
            client.callback = response => {
              if (response.error) {
                reject(new Error(response.error));
                return;
              }
              accessToken = response.access_token || "";
              resolve(accessToken);
            };
            client.requestAccessToken({ prompt: accessToken ? "" : "consent" });
          } catch (error) {
            reject(error);
          }
        });
      }

      async function fetchWeekEvents() {
        renderCalendar([]);
        if (!accessToken) {
          setCalendarStatus("Googleに接続すると家族の予定を表示します。");
          return;
        }

        const start = displayedPeriodStart();
        const endExclusive = addDays(start, 2);
        const params = new URLSearchParams({
          timeMin: start.toISOString(),
          timeMax: endExclusive.toISOString(),
          singleEvents: "true",
          orderBy: "startTime",
          maxResults: "100",
          timeZone: "Asia/Tokyo"
        });

        setCalendarStatus("予定を読み込んでいます…");

        try {
          const response = await fetch(
            "https://www.googleapis.com/calendar/v3/calendars/" +
              encodeURIComponent(FAMILY_CALENDAR_ID) + "/events?" + params.toString(),
            {
              headers: {
                Authorization: "Bearer " + accessToken
              }
            }
          );

          if (response.status === 401) {
            accessToken = "";
            setCalendarStatus("Googleの接続期限が切れました。もう一度接続してください。", true);
            connectGoogle.textContent = "Googleに再接続";
            return;
          }

          if (!response.ok) {
            const body = await response.text();
            throw new Error("Calendar API " + response.status + ": " + body.slice(0, 180));
          }

          const data = await response.json();
          renderCalendar(data.items || []);
          setCalendarStatus((data.items || []).length + "件の予定を読み込みました。");
          connectGoogle.textContent = "Google接続済み";
        } catch (error) {
          console.error(error);
          setCalendarStatus("予定を取得できませんでした。API設定や共有権限を確認してください。", true);
        }
      }

      connectGoogle.addEventListener("click", async () => {
        connectGoogle.disabled = true;
        setCalendarStatus("Googleに接続しています…");
        try {
          await requestAccessToken();
          await fetchWeekEvents();
        } catch (error) {
          console.error(error);
          setCalendarStatus("Googleに接続できませんでした。OAuth設定を確認してください。", true);
        } finally {
          connectGoogle.disabled = false;
        }
      });

      prevWeek.addEventListener("click", async () => {
        dayOffset -= 2;
        await fetchWeekEvents();
      });

      thisWeek.addEventListener("click", async () => {
        dayOffset = 0;
        await fetchWeekEvents();
      });

      nextWeek.addEventListener("click", async () => {
        dayOffset += 2;
        await fetchWeekEvents();
      });

      function updateMeasuredViewport() {
        const viewportHeight = window.visualViewport
          ? window.visualViewport.height
          : window.innerHeight;
        document.documentElement.style.setProperty("--app-vh", viewportHeight + "px");

        const app = document.querySelector(".app");
        if (!app) return;

        const isLandscape = window.matchMedia("(orientation: landscape)").matches;
        if (!isLandscape) {
          app.classList.remove("fit-landscape");
          document.documentElement.style.setProperty("--landscape-scale", "1");
          return;
        }

        app.classList.remove("fit-landscape");
        document.documentElement.style.setProperty("--landscape-scale", "1");

        requestAnimationFrame(() => {
          const available = Math.max(1, viewportHeight - 2);
          const needed = Math.max(1, app.scrollHeight);
          const scale = Math.min(1, available / needed);
          document.documentElement.style.setProperty(
            "--landscape-scale",
            String(Math.max(0.72, scale))
          );
          if (scale < 0.999) app.classList.add("fit-landscape");
        });
      }

      window.addEventListener("resize", updateMeasuredViewport);
      window.addEventListener("orientationchange", () => {
        setTimeout(updateMeasuredViewport, 60);
        setTimeout(updateMeasuredViewport, 300);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", updateMeasuredViewport);
      }

      renderCalendar([]);

      renderMeals();
      renderTodos();
      updateWeather(false);
      updateMeasuredViewport();

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    })();
  </script>
</body>
